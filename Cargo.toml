[package]
name = "kubeezcut"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "High-performance, pure Rust port of KubeezMedia/KubeezCut — modern non-linear video editing (NLE) engine, multi-track timeline, WebGPU/shader effects pipeline, keyframe Bezier animation, and headless render export."
license = "MIT"
repository = "https://github.com/bhubbard/kubeezcut-rs"
homepage = "https://github.com/bhubbard/kubeezcut-rs"
keywords = ["video-editor", "nle", "timeline", "keyframes", "video-rendering"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.11"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "kubeezcut"
path = "src/main.rs"

[lib]
name = "kubeezcut"
path = "src/lib.rs"
